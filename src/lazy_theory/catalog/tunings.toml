# String tunings: the note name of the first string, then the gaps in steps between neighbouring
# open strings. Negative gaps are re-entrant strings (lower than the one before).

[tunings]
"guitar standard" = { first = "E", gaps = [5, 5, 5, 4, 5] }
"guitar drop D" = { first = "D", gaps = [7, 5, 5, 4, 5] }
"guitar DADGAD" = { first = "D", gaps = [7, 5, 5, 2, 5] }
"guitar open D" = { first = "D", gaps = [7, 5, 4, 3, 5] }
"guitar open G" = { first = "D", gaps = [5, 7, 5, 4, 3] }
"guitar all fourths" = { first = "E", gaps = [5, 5, 5, 5, 5] }
"bass standard" = { first = "E", gaps = [5, 5, 5] }
"ukulele standard" = { first = "G", gaps = [-7, 4, 5] }
