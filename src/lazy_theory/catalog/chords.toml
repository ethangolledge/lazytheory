# Chord patterns as pitch classes measured from the chord root, in `size` steps per period.

size = 12

[chords]
"major" = [0, 4, 7]
"minor" = [0, 3, 7]
"diminished" = [0, 3, 6]
"augmented" = [0, 4, 8]
"sus2" = [0, 2, 7]
"sus4" = [0, 5, 7]
"major 7th" = [0, 4, 7, 11]
"dominant 7th" = [0, 4, 7, 10]
"minor 7th" = [0, 3, 7, 10]
"minor major 7th" = [0, 3, 7, 11]
"half-diminished 7th" = [0, 3, 6, 10]
"diminished 7th" = [0, 3, 6, 9]
"augmented 7th" = [0, 4, 8, 10]
"augmented major 7th" = [0, 4, 8, 11]

# How each chord is written after its root note, e.g. "m7" for E minor 7th → Em7.
[symbols]
"major" = ""
"minor" = "m"
"diminished" = "dim"
"augmented" = "aug"
"sus2" = "sus2"
"sus4" = "sus4"
"major 7th" = "maj7"
"dominant 7th" = "7"
"minor 7th" = "m7"
"minor major 7th" = "m(maj7)"
"half-diminished 7th" = "m7b5"
"diminished 7th" = "dim7"
"augmented 7th" = "aug7"
"augmented major 7th" = "maj7#5"
