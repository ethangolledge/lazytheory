# Fretted instruments: scale length (nut to bridge, mm), then each tuning as its first open
# string (letter, accidentals, octave) and the gaps in steps between neighbouring open strings.
# Negative gaps are re-entrant strings (lower than the one before). Frequencies are measured
# from `reference`. An instrument in another temperament gives `steps` per `period` (a frequency
# ratio, 2 for the octave; 3 for Bohlen-Pierce) and its `first` string in steps above C0.

reference = { note = "A4", hertz = 440.0 }

[guitar]
scale_length = 648.0
tunings.standard = { first = "E2", gaps = [5, 5, 5, 4, 5] }
tunings."drop D" = { first = "D2", gaps = [7, 5, 5, 4, 5] }
tunings.DADGAD = { first = "D2", gaps = [7, 5, 5, 2, 5] }
tunings."open D" = { first = "D2", gaps = [7, 5, 4, 3, 5] }
tunings."open G" = { first = "D2", gaps = [5, 7, 5, 4, 3] }
tunings."all fourths" = { first = "E2", gaps = [5, 5, 5, 5, 5] }

[bass]
scale_length = 864.0
tunings.standard = { first = "E1", gaps = [5, 5, 5] }

[ukulele]
scale_length = 345.0
tunings.standard = { first = "G4", gaps = [-7, 4, 5] }
